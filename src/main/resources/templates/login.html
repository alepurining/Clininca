<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clínica | Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/clinica.css}">
</head>

<body class="recovery">
<header><a th:href="@{/}">Clínica</a></header>
<main>
    <section>
        <h1>Iniciar sesión</h1>
        <p>Ingresa tu correo y tu contraseña.</p>
        <p class="message" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/login}" method="post">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" maxlength="100" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" maxlength="100" required>

            <button type="submit">Entrar</button>
        </form>

        <a class="back" th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
    </section>
</main>
</body>
</html>
